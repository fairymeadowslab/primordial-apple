name: Release commit check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the validator and hook
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 scripts/check_release_commit.py --base "$BASE_SHA" --head "$HEAD_SHA"
